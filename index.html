<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

/* ===== 🌙 CLEAN AMBIENT BACKGROUND ===== */
body {
  color: white;
  background: #050507;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: -40%;
  z-index: -1;
  background:
    radial-gradient(circle at 30% 20%, rgba(0,255,200,0.10), transparent 45%),
    radial-gradient(circle at 70% 60%, rgba(0,120,255,0.08), transparent 50%);
  filter: blur(90px);
}

/* ===== HEADER ===== */
.channel-banner {
  height: 260px;
  background: url('https://yt3.googleusercontent.com/O2VmR1nkaz9QnV6xi_ZBIOsYAOmy8zAQxJgLHyxOwTOya5cLdGVAVDwfyy1uBo9q8DWZAJ5J=w1138-fcrop64=1,00005a57ffffa5a8-k-c0xffffffff-no-nd-rj')
  center/cover no-repeat;
}

.channel-info {
  padding: 0 60px;
  margin-top: -70px;
}

.channel-info img {
  width: 120px;
  border-radius: 50%;
  border: 3px solid #00ffcc;
}

h2 {
  color: #00ffcc;
  margin-top: 10px;
}

/* ===== TITLES ===== */
.section-title {
  padding: 25px 60px;
  color: #00ffcc;
  font-size: 22px;
}

/* ===== VIDEOS GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(320px, 1fr));
  gap: 20px;
  padding: 0 60px 60px;
}

/* ===== VIDEO CARD ===== */
.card {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  transition: 0.3s;
}

.card:hover {
  transform: scale(1.03);
  box-shadow: 0 0 20px rgba(0,255,200,0.25);
}

/* 🔥 FIXED YOUTUBE EMBED */
iframe {
  width: 100%;
  height: 220px;
  border: none;
}

.card p {
  padding: 10px;
  text-align: center;
  color: #ccc;
}

/* ===== PLAYLIST GRID ===== */
.playlist-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(170px, 200px));
  gap: 18px;
  padding: 0 60px 60px;
}

/* ===== PLAYLIST CARD ===== */
.playlist-card {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  cursor: pointer;
  transition: 0.25s;
  text-align: center;
}

.playlist-card:hover {
  transform: scale(1.06);
  box-shadow: 0 0 18px rgba(0,255,200,0.25);
}

.playlist-card img {
  width: 100%;
  height: 110px;
  object-fit: cover;
  display: block;
}

.playlist-card p {
  font-size: 13px;
  padding: 8px;
  color: #ccc;
}

/* LINKS */
a {
  text-decoration: none;
  color: inherit;
}
</style>

</head>
