<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>GTA Episodes - SL PRAVIYA Gaming</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
  font-family: Arial, sans-serif;
}

/* ===== BACKGROUND ===== */
body {
  color: white;
  background: #050507;
  overflow-x: hidden;
  position: relative;
}

body::before {
  content: "";
  position: fixed;
  inset: -40%;
  z-index: -1;
  background:
    radial-gradient(circle at 30% 20%, rgba(0,255,200,0.10), transparent 45%),
    radial-gradient(circle at 70% 60%, rgba(0,120,255,0.08), transparent 50%);
  filter: blur(90px);
}

/* ===== HEADER ===== */
.header {
  padding: 30px 60px;
}

.header h1 {
  color: #00ffcc;
}

.back-btn {
  display: inline-block;
  margin-top: 15px;
  padding: 10px 15px;
  background: #111;
  color: #00ffcc;
  text-decoration: none;
  border-radius: 8px;
}

/* ===== TABS ===== */
.tabs {
  display: flex;
  gap: 10px;
  padding: 20px 60px;
}

.tab-btn {
  padding: 10px 15px;
  background: #111;
  border: none;
  color: #ccc;
  border-radius: 8px;
  cursor: pointer;
}

.tab-btn.active {
  background: #00ffcc;
  color: #000;
}

/* ===== GRID ===== */
.grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
  gap: 20px;
  padding: 10px 60px 60px;
}

.card {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
}

iframe {
  width: 100%;
  height: 200px;
  border: none;
}

.card p {
  padding: 10px;
  text-align: center;
  color: #ccc;
}

/* ===== SHORTS GRID ===== */
.shorts-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(220px, 260px));
  gap: 20px;
  padding: 20px 60px 60px;
  justify-content: center;
}

/* ===== SHORT CARD ===== */
.short-card {
  background: #111;
  border-radius: 12px;
  overflow: hidden;
  text-align: center;
}

.short-card iframe {
  width: 100%;
  height: 420px;
  border: none;
}

.short-card p {
  padding: 10px;
  font-size: 14px;
  color: #ccc;
}

/* ===== HIDE CLASS ===== */
.hidden {
  display: none !important;
}
</style>

</head>

<body>

<div class="header">
  <h1>🚔GTA Episodes🚔</h1>
  <a class="back-btn" href="Main Page.html">⬅ Back to Home</a>
</div>

<!-- TABS -->
<div class="tabs">
  <button class="tab-btn active" onclick="showTab('episodes', this)">🎬 Episodes</button>
  <button class="tab-btn" onclick="showTab('shorts', this)">🎞️ Shorts</button>
</div>

<!-- EPISODES -->
<div id="episodes" class="grid">

  <div class="card">
    <iframe src="https://www.youtube.com/embed/L7tphzCQjrA" allowfullscreen></iframe>
    <p>බැංකු කඩමු හම්බ කරමු 😈 - GTA 5 Sinhala Gameplay part 1</p>
  </div>

  <div class="card">
    <iframe src="https://www.youtube.com/embed/zsTGlIUyWzU" allowfullscreen></iframe>
    <p>බයිසිකලයක් උස්සමු. - GTA 5 Sinhala Gameplay</p>
  </div>

  <div class="card">
    <iframe src="https://www.youtube.com/embed/leHMrNxqUD0" allowfullscreen></iframe>
    <p>GTA හැඩ වෙලා & අලුත් වෙලා. The best graphic mod for Gta Sanadreas ( DirectX 3.0 )</p>
  </div>

</div>

<!-- SHORTS -->
<div id="shorts" class="shorts-grid hidden">

  <div class="short-card">
    <iframe src="" allowfullscreen></iframe>
    <p>No Shorts Here</p>
  </div>

</div>

<script>
function showTab(tab, btn) {

  let episodes = document.getElementById("episodes");
  let shorts = document.getElementById("shorts");

  episodes.classList.add("hidden");
  shorts.classList.add("hidden");

  if(tab === "episodes") {
    episodes.classList.remove("hidden");
  } else {
    shorts.classList.remove("hidden");
  }

  document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
  btn.classList.add("active");
}
</script>

</body>
</html>
